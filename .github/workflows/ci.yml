# Compile le projet Unity et lance les tests à chaque push et pull request.
# Secrets requis (Settings > Secrets and variables > Actions) :
#   UNITY_LICENSE  : contenu du fichier Unity_lic.ulf
#   UNITY_EMAIL    : courriel du compte Unity
#   UNITY_PASSWORD : mot de passe du compte Unity
name: CI Unity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Compilation + tests EditMode
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('Assets/**/*.asmdef') }}
          restore-keys: |
            Library-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-

      - name: Tests Unity
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.10f1
          # GameCI v4 vise encore les images « -3 » ; seules les « -4 » existent pour Unity 6.6.
          customImage: unityci/editor:ubuntu-6000.6.10f1-linux-il2cpp-4
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Résultats des tests EditMode

      - name: Publier les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: ${{ steps.tests.outputs.artifactsPath }}
