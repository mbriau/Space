# Runs the EditMode tests in a Linux container with GameCI.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_EMAIL, UNITY_PASSWORD  the Unity account that activates the license
#   UNITY_LICENSE                optional: contents of a Unity_lic.ulf file
#
# Manual trigger for now (Actions > Tests Unity > Run workflow), so it does not use
# GitHub Actions minutes on every push.
name: Tests Unity

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: Tests EditMode
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # The Library folder (imported assets) is long to rebuild: keep it between runs.
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-

      - name: Run the EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Tests EditMode

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts
          if-no-files-found: warn
